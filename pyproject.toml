[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mazegen"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
    "pydantic"
]

[tool.setuptools]
packages = ["mazegen"]
package-dir = {"" = "src"}

[tool.mypy]
exclude = [
    'venv/',
    'src/mlx_CLXV',
]